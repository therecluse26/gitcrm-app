# Deploys main to this repository's GitHub Pages site (spec 09, ADR-025). Every copy of the
# template runs it. This is a software task, not CRM work (ADR-006): no CRM data passes through it.
#
# No secrets. The build job runs every check and builds once. The deploy job, with only the
# workflow's own token, deploys that same build and runs no project code. The check job reads the
# live site. Actions are pinned to commit SHAs, because a tag can move.
#
# The workflow cannot turn on Pages. Set Settings > Pages > Source to "GitHub Actions" first;
# until then the deploy job fails at "Configure Pages".
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One deploy at a time. A newer push replaces a queued run, so the newest main wins.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm test
      # tsc, vite build, and the build audit (docs/07).
      - run: npm run build
      # The browser tests serve dist/, the folder that the deploy job uploads.
      - run: npm run test:e2e
        env:
          E2E_BUILD: dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  # The template itself never deploys, so it never becomes a central copy (ADR-025).
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && !github.event.repository.is_template
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  check:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Check the live site
        run: node scripts/check-deploy.ts "$PAGE_URL" dist
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
