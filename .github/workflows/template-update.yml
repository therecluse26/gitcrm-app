# Updates this copy to the template's latest release (spec 11, ADR-026). The owner starts it, from
# the app's update banner or the Actions tab. This is a software task, not CRM work (ADR-006): no
# CRM data passes through it.
#
# It runs only this repository's own code. scripts/template-update.ts runs before any template
# file is in the working tree, and nothing runs after. A push with the workflow's own token starts
# no workflow, so the job starts Deploy itself. Actions are pinned to commit SHAs, because a tag
# can move.
name: Template update

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: template-update
  cancel-in-progress: false

env:
  TEMPLATE: therecluse26/GitCRM

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # push the update to main
      actions: write # start Deploy
    steps:
      # The push uses the credentials that checkout keeps.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Update to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          read -r is_template base < <(gh api "repos/$GITHUB_REPOSITORY" --jq '"\(.is_template) \(.default_branch)"')
          if [ "$is_template" = true ]; then
            echo "This is the template, so it has nothing to update from."
            exit 0
          fi
          if [ "$GITHUB_REF_NAME" != "$base" ]; then
            echo "::error::Run this workflow from $base, the default branch."
            exit 1
          fi
          if ! tag=$(gh api "repos/$TEMPLATE/releases/latest" --jq .tag_name); then
            echo "::error::GitHub returned no latest release of $TEMPLATE. The template must be public, with at least one release."
            exit 1
          fi
          node scripts/template-update.ts "$TEMPLATE" "$tag" "$RUNNER_TEMP"
          if [ ! -f "$RUNNER_TEMP/summary.md" ]; then
            echo "This copy is up to date with $tag."
            exit 0
          fi
          git push -q origin "HEAD:$base"
          gh workflow run deploy.yml --ref "$base"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/workflows.txt" ]; then
            echo "::warning::$tag changes workflow files, which this workflow cannot update. The run summary lists them; copy each one by hand."
          fi
